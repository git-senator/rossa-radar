name: Обход каналов

on:
  schedule:
    # Частый обход — только каналы, шесть последних роликов у каждого: ~208
    # единиц квоты. Раз в час, 24 раза в сутки ≈ 5 000.
    - cron: '5 * * * *'
    # Раз в сутки — полный: с поисковыми запросами и на всю глубину, ~1130
    # единиц. 06:25 UTC — утро в Москве, ночь в Бразилии.
    - cron: '25 6 * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Полный обход — ещё и поисковые запросы (дороже квоты)'
        type: boolean
        default: false

# Нужен для коммита state/seen.json обратно в репозиторий.
permissions:
  contents: write

# Два обхода одновременно записали бы память друг поверх друга.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Обойти каналы и оповестить
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WITH_QUERIES: ${{ github.event.schedule == '25 6 * * *' || inputs.deep }}
        run: node scripts/watch.mjs

      - name: Запомнить показанных
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  'rossa-radar'
            git config user.email 'radar@users.noreply.github.com'
            git add state/
            git commit -m 'Память обхода'
            git pull --rebase --autostash
            git push
          else
            echo 'Ничего нового — память не изменилась.'
          fi
